services:
  engine:
    build: ./engine
    container_name: threatscope_engine
    profiles:
      - capture
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    environment:
      API_URL: http://api:8000/alerts
    volumes:
      - ./engine:/app
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: dockerfile
    container_name: threatscope_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./api:/app
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: threatscope_dashboard
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./dashboard:/app
      - /app/node_modules        # preserve node_modules inside container
    depends_on:
      - api
    restart: unless-stopped
